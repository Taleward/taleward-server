[project]
name = "taleward-server"
version = "0.4.122"
description = "Taleward – Server für Recaps und Kampagnenbibel von Rollenspielrunden"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "pwdlib[argon2]>=0.2",
    "argon2-cffi>=23.1",  # Sicherung mit Passwort (app/sicherung_passwort.py) nutzt es direkt
    "cryptography>=42",  # ebenso (AES-256-GCM)
    "typer>=0.12",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pillow>=11",
    "pypdf>=5",
    "segno>=1.6",
    "tzdata>=2024.1; sys_platform == 'win32'",  # Windows hat keine eigene Zeitzonen-Datenbank (Europe/Berlin)
]

[project.optional-dependencies]
# KI-Verarbeitung (Transkription, Sprechertrennung). Installieren mit: uv sync --extra ki
ki = [
    "whisperx==3.8.6",
    "transformers>=5.10",  # Lücken bis 5.9 geschlossen; whisperx selbst verlangt nur >=4.48
    "truststore>=0.10",  # Zertifikate aus dem Windows-/macOS-Speicher (Virenscanner, Firmen-Proxy)
    "imageio-ffmpeg==0.6.0",  # ffmpeg für die Worker-App (bisher ohne feste Fassung nachinstalliert)
]

[project.scripts]
chronik = "app.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "pyyaml>=6",
    "rfc3339-validator>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Für Installationen ohne Quellordner (KI-Paket der Worker-App, „Alles auf diesem PC“): Datenbank-Migrationen mitliefern
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "app/_migrationen"
"alembic.ini" = "app/_migrationen/alembic.ini"

# whisperx 3.8.6 verlangt torch 2.8 und huggingface-hub unter 1.0; die KI-Pakete laufen auf den neueren Fassungen
# (geprüft im Probelauf), die bekannte Lücken in torch und transformers schließen. torchaudio, torchvision und
# torchcodec passen zu dieser torch-Fassung; alle vier gibt es im PyTorch-Verzeichnis für cu128 (Worker-App,
# Dockerfile.worker), und torch von PyPI bringt dieselben CUDA-12.8-Bibliotheken mit wie das Verzeichnis.
[tool.uv]
override-dependencies = [
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchvision==0.25.0",
    "torchcodec==0.10.0",
    "huggingface-hub>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
